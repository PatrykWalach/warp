[package]
name = "intern"
version = "0.0.4"
authors = ["forked from Facebook"]
edition = "2021"
description = "Intern data into a 32-bit id; forked from the Relay repo to increase reliability of GitHub Actions"
repository = "https://github.com/facebook/relay"
license = "MIT"

[[bench]]
name = "string_intern_bench"
harness = false

[dependencies]
fnv = "=1.0.7"
hashbrown = { version = "=0.12.3", features = ["raw", "serde"] }
indexmap = { version = "=2.14.0", features = ["arbitrary", "rayon", "serde"] }
once_cell = "=1.21.4"
parking_lot = { version = "=0.12.5", features = ["send_guard"] }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_bytes = "=0.11.5"
serde_derive = "=1.0.229"
smallvec = { version = "=1.8.0", features = ["serde", "union"] }

[dev-dependencies]
bincode = "=1.3.3"
divan = { version = "=5.0.1", package = "codspeed-divan-compat" }
rand = { version = "=0.8.5", features = ["small_rng"] }
serde_json = { version = "=1.0.151", features = [
    "float_roundtrip",
    "unbounded_depth",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(memory_consistency_assertions)',
] }

[lints.clippy]
all = "allow"
pedantic = "allow"
